[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocverify"
version = "2.0.0"
description = "Lint before you run: a static gate and evidence runner for PoC templates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xiangfuhua" }]
keywords = ["security", "poc", "nuclei", "static-analysis", "sarif", "vulnerability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mock = ["Flask>=3.0"]

[project.urls]
Homepage = "https://github.com/xiangfuhua/poc-verify"
Documentation = "https://github.com/xiangfuhua/poc-verify/blob/main/docs/rules.md"
Issues = "https://github.com/xiangfuhua/poc-verify/issues"
Changelog = "https://github.com/xiangfuhua/poc-verify/blob/main/CHANGELOG.md"

[project.scripts]
pocverify = "pocverify.cli:entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
