name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  gate:
    name: lint and gate
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .

      - name: Lint the bundled templates
        run: pocverify lint pocs --fail-on high

      - name: The gate must refuse a known-bad template
        shell: bash
        run: |
          set +e
          pocverify lint examples/demo-unsafe.yaml --fail-on high
          code=$?
          set -e
          test "$code" -eq 1

      - name: Build a SARIF report for code scanning
        continue-on-error: true
        run: pocverify lint examples --format sarif -o pocverify.sarif --fail-on critical

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always() && hashFiles('pocverify.sarif') != ''
        with:
          sarif_file: pocverify.sarif
          category: pocverify
